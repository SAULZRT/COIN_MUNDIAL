<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Los animales y el silencio</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: "Comic Sans MS", "Chalkboard SE", "Trebuchet MS", sans-serif; user-select: none; }
  body { background: #222; }

  #escena { position: fixed; inset: 0; overflow: hidden; }
  .capa { position: absolute; top: 0; left: -60px; pointer-events: none; will-change: transform; }
  .capa svg { display: block; }
  canvas { position: absolute; inset: 0; pointer-events: none; }
  #cvFondo { z-index: 2; }
  #cvFrente { z-index: 300; }
  #vineta { position: absolute; inset: 0; z-index: 310; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,.28)); }
  #velo { position: fixed; inset: 0; z-index: 900; background: #fff; opacity: 1; pointer-events: none; transition: opacity .4s; }

  .decor { position: absolute; left: 0; top: 0; pointer-events: none; line-height: 1; will-change: transform; }
  .decor svg { display: block; overflow: visible; }
  .bal { transform-box: fill-box; transform-origin: 50% 100%; animation: balanceo var(--d, 4s) ease-in-out infinite alternate; }
  @keyframes balanceo { from { transform: rotate(calc(var(--a, 2deg) * -1)); } to { transform: rotate(var(--a, 2deg)); } }
  .gira { animation: gira 80s linear infinite; }
  @keyframes gira { to { transform: rotate(360deg); } }

  .sombra { position: absolute; left: 0; top: 0; border-radius: 50%; pointer-events: none; background: radial-gradient(closest-side, rgba(0,0,0,.4), rgba(0,0,0,0)); }
  .animal { position: absolute; left: 0; top: 0; line-height: 1; cursor: pointer; transform-origin: 50% 100%; will-change: transform; }
  .animal .cuerpo { display: inline-block; transform-origin: 50% 100%; }
  .animal .burbuja { position: absolute; left: 50%; top: -.5em; font-size: .42em; opacity: 0; transform: translateX(-50%) scale(.3); transition: opacity .2s, transform .2s; pointer-events: none; }
  .animal .burbuja.pop { opacity: 1; transform: translateX(-50%) scale(1); animation: pop .4s; }
  @keyframes pop { 0% { transform: translateX(-50%) scale(.2); } 60% { transform: translateX(-50%) scale(1.3); } 100% { transform: translateX(-50%) scale(1); } }
  .animal .nombre { position: absolute; left: 50%; bottom: -.4em; transform: translateX(-50%); font-size: .24em; background: #fff; color: #333; padding: .1em .5em; border-radius: 1em; white-space: nowrap; opacity: 0; transition: opacity .3s; box-shadow: 0 3px 0 rgba(0,0,0,.2); font-weight: bold; pointer-events: none; }
  .animal.nombrado .nombre { opacity: 1; }

  /* Interfaz */
  #entornos { position: fixed; top: 10px; left: 0; right: 0; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; padding: 0 10px; z-index: 1000; }
  #entornos button { font: inherit; font-size: 18px; font-weight: bold; border: 0; border-radius: 18px; padding: 8px 14px; background: rgba(255,255,255,.88); color: #333; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.25); display: flex; align-items: center; gap: 6px; transition: transform .15s; }
  #entornos button:hover { transform: translateY(-2px); }
  #entornos button span { font-size: 28px; }
  #entornos button.activo { background: #ffd54f; transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,.25); }

  #mensaje { position: fixed; top: 80px; left: 50%; transform: translateX(-50%); z-index: 1000; background: rgba(255,255,255,.92); color: #333; font-size: 26px; font-weight: bold; padding: 10px 24px; border-radius: 30px; box-shadow: 0 4px 0 rgba(0,0,0,.2); white-space: nowrap; transition: background .3s; }
  #mensaje.alerta { background: #ff7043; color: #fff; animation: tiembla .4s; }
  @keyframes tiembla { 25% { transform: translateX(-52%); } 75% { transform: translateX(-48%); } }

  #panel { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 1000; display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,.92); padding: 10px 16px; border-radius: 30px; box-shadow: 0 4px 0 rgba(0,0,0,.2); }
  #cara { font-size: 44px; width: 52px; text-align: center; }
  #medidor { width: 260px; height: 30px; background: #ddd; border-radius: 15px; overflow: hidden; position: relative; }
  #nivel { height: 100%; width: 0%; background: #66bb6a; border-radius: 15px; transition: background .2s; }
  #medidor::before { content: ""; position: absolute; top: 0; bottom: 0; left: 42%; right: 10%; background: repeating-linear-gradient(45deg, rgba(255,112,67,.18) 0 6px, transparent 6px 12px); }
  #medidor::after { content: ""; position: absolute; top: 0; bottom: 0; left: 90%; width: 4px; background: #e53935; }
  #panel button { font: inherit; font-size: 18px; font-weight: bold; border: 0; border-radius: 20px; padding: 10px 16px; cursor: pointer; box-shadow: 0 4px 0 rgba(0,0,0,.25); }
  #btnMic { background: #4fc3f7; color: #fff; }
  #btnMic.on { background: #43a047; }
  #btnPalmada { background: #ffb74d; color: #fff; }
  #ajustes { display: flex; flex-direction: column; align-items: center; font-size: 12px; color: #555; }
  #ajustes input { width: 90px; }

  @media (max-width: 700px) {
    #entornos { gap: 4px; padding: 0 4px; flex-wrap: nowrap; }
    #entornos button { font-size: 0; padding: 5px 6px; border-radius: 12px; }
    #entornos button span { font-size: 24px; }
    #mensaje { font-size: 17px; top: 62px; }
    #medidor { width: 110px; }
    #panel { gap: 8px; padding: 8px 10px; }
    #panel button { font-size: 14px; padding: 8px 10px; }
    #ajustes { display: none; }
  }
</style>
</head>
<body>
<div id="escena">
  <canvas id="cvFondo"></canvas>
  <canvas id="cvFrente"></canvas>
  <div id="vineta"></div>
</div>
<div id="velo"></div>

<nav id="entornos"></nav>
<div id="mensaje">🤫 Silencio... ¡vienen los animales!</div>

<div id="panel">
  <div id="cara">🙂</div>
  <div id="medidor"><div id="nivel"></div></div>
  <button id="btnMic">🎤 Micrófono</button>
  <button id="btnPalmada">👏 ¡Ruido!</button>
  <label id="ajustes">Sensibilidad<input id="sens" type="range" min="1" max="10" value="5"></label>
</div>

<script>
// =====================================================================
//  UTILIDADES
// =====================================================================
const $ = id => document.getElementById(id);
const W = () => window.innerWidth, H = () => window.innerHeight;
const azar = (a, b) => a + Math.random() * (b - a);
const elegir = arr => arr[Math.floor(Math.random() * arr.length)];
const limitar = (v, a, b) => Math.max(a, Math.min(b, v));
function semilla(s) { return () => { s |= 0; s = s + 0x6D2B79F5 | 0; let t = Math.imul(s ^ s >>> 15, 1 | s); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function tono(hex, p) {
  const n = parseInt(hex.slice(1), 16); const c = [n >> 16, n >> 8 & 255, n & 255];
  const f = v => Math.round(p < 0 ? v * (1 + p) : v + (255 - v) * p);
  return '#' + ((1 << 24) | (f(c[0]) << 16) | (f(c[1]) << 8) | f(c[2])).toString(16).slice(1);
}
let contId = 0; const uid = () => 'g' + (contId++);
const f1 = v => v.toFixed(1);

// =====================================================================
//  DIBUJOS DEL PAISAJE (SVG). Cada uno devuelve [ancho, alto, svg]
//  con la base del objeto abajo en el centro.
// =====================================================================
const ARTE = {
  palmera(r, o) {
    const lean = (r() - .5) * 60, tx = 100 + lean, ty = 70, hoja = o.hoja || '#3f9b3a';
    const tronco = `M100 300 Q${f1(100 + lean * .15)} 190 ${f1(tx)} ${ty}`;
    const hojaP = c => `<path d="M0 0 Q40 -30 92 8 Q45 -6 0 0Z" fill="${c}"/><path d="M0 0 Q45 -22 90 7" stroke="${tono(c, -.35)}" stroke-width="1.5" fill="none"/>`;
    let s = `<g class="bal" style="--a:1.2deg;--d:${f1(3 + r() * 2)}s">`;
    s += `<path d="${tronco}" stroke="#8a6440" stroke-width="15" fill="none" stroke-linecap="round"/>`;
    s += `<path d="${tronco}" stroke="#6b4a2e" stroke-width="15" fill="none" stroke-dasharray="3 9"/>`;
    s += `<g transform="translate(${f1(tx)} ${ty})"><g class="bal" style="--a:5deg;--d:${f1(2 + r() * 1.5)}s">`;
    for (const lado of [-1, 1]) for (const ang of [-50, -18, 15]) s += `<g transform="scale(${lado} 1) rotate(${f1(ang + (r() - .5) * 10)})">${hojaP(ang < 0 ? tono(hoja, .15) : hoja)}</g>`;
    s += `<g transform="rotate(-82)">${hojaP(tono(hoja, .25))}</g>`;
    s += `<circle cx="-6" cy="8" r="7" fill="#6d4c2f"/><circle cx="6" cy="9" r="7" fill="#5d3f26"/><circle cx="0" cy="13" r="6.5" fill="#6d4c2f"/>`;
    return [200, 300, s + '</g></g></g>'];
  },
  arbol(r, o) {
    const [c1, c2, c3] = o.hojas || ['#2e7d32', '#43a047', '#66bb6a'];
    let s = `<path d="M84 280 Q92 210 90 150 L110 150 Q108 210 116 280 Z" fill="#6d4c41"/><path d="M101 280 Q103 210 100 150 L110 150 Q108 210 116 280Z" fill="#5d4037"/>`;
    s += `<path d="M96 195 Q80 172 66 162" stroke="#6d4c41" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M104 185 Q120 165 134 158" stroke="#5d4037" stroke-width="6" fill="none" stroke-linecap="round"/>`;
    s += `<g class="bal" style="--a:1.5deg;--d:${f1(3.5 + r() * 2)}s">`;
    const bolas = (n, rx, ry, cy, rad, col) => { let t = ''; for (let i = 0; i < n; i++) { const a = r() * Math.PI * 2, d = Math.sqrt(r()); t += `<circle cx="${f1(100 + Math.cos(a) * rx * d)}" cy="${f1(cy + Math.sin(a) * ry * d)}" r="${f1(rad * (.75 + r() * .5))}" fill="${col}"/>`; } return t; };
    s += bolas(10, 64, 42, 118, 38, c1) + bolas(7, 50, 30, 102, 30, c2) + bolas(5, 34, 18, 86, 20, c3);
    if (o.lianas) for (let i = 0; i < 3; i++) { const x = 55 + r() * 90, l = 60 + r() * 70; s += `<path d="M${f1(x)} 135 q8 ${f1(l / 3)} 0 ${f1(l * 2 / 3)} t0 ${f1(l / 3)}" stroke="#2f6b2a" stroke-width="3" fill="none"/><ellipse cx="${f1(x)}" cy="${f1(135 + l)}" rx="6" ry="3.5" fill="#4caf50"/>`; }
    if (o.frutos) for (let i = 0; i < 6; i++) s += `<circle cx="${f1(50 + r() * 100)}" cy="${f1(85 + r() * 55)}" r="5" fill="${o.frutos}"/>`;
    return [200, 280, s + '</g>'];
  },
  pino(r, o) {
    const c = o.color || '#2e6b3f';
    let s = `<rect x="53" y="215" width="14" height="45" fill="#5d4037"/><g class="bal" style="--a:1deg;--d:${f1(4 + r() * 2)}s">`;
    for (let k = 0; k < 4; k++) {
      const top = 15 + k * 48, half = 24 + k * 12, bot = top + 75;
      s += `<polygon points="60,${top} ${60 - half},${bot} ${60 + half},${bot}" fill="${tono(c, .1 - k * .03)}"/><polygon points="60,${top} ${60 + half},${bot} 60,${bot}" fill="${tono(c, -.3)}" opacity=".55"/>`;
      if (o.nieve) s += `<path d="M60 ${top} L${f1(60 - half * .45)} ${top + 33} q${f1(half * .15)} 6 ${f1(half * .3)} 0 q${f1(half * .15)} 6 ${f1(half * .3)} 0 q${f1(half * .15)} 6 ${f1(half * .3)} 0 Z" fill="#fff"/>`;
    }
    return [120, 260, s + '</g>'];
  },
  acacia(r) {
    let s = `<path d="M130 220 Q126 180 128 150" stroke="#5b4636" stroke-width="13" fill="none" stroke-linecap="round"/><path d="M128 152 Q120 118 92 86 M128 152 Q138 118 172 88 M128 160 Q118 128 122 94" stroke="#5b4636" stroke-width="7" fill="none" stroke-linecap="round"/>`;
    s += `<g class="bal" style="--a:1deg;--d:${f1(4 + r() * 2)}s"><ellipse cx="130" cy="82" rx="118" ry="23" fill="#5f7a2e"/><ellipse cx="120" cy="70" rx="96" ry="18" fill="#748f38"/><ellipse cx="152" cy="63" rx="56" ry="12" fill="#8aa845"/><ellipse cx="82" cy="70" rx="40" ry="10" fill="#8aa845"/></g>`;
    return [260, 220, s];
  },
  cactus(r) {
    const c = '#4a9c4a', osc = tono(c, -.25), cla = tono(c, .25);
    const brazo = d => `<path d="${d}" stroke="${osc}" stroke-width="21" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="${d}" stroke="${c}" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round"/>`;
    const y1 = 105 + r() * 30, y2 = 85 + r() * 30;
    let s = brazo(`M50 ${f1(y1)} H28 Q22 ${f1(y1)} 22 ${f1(y1 - 8)} V${f1(y1 - 55)}`) + brazo(`M70 ${f1(y2)} H92 Q98 ${f1(y2)} 98 ${f1(y2 - 8)} V${f1(y2 - 45)}`);
    s += `<rect x="43" y="18" width="34" height="185" rx="17" fill="${c}"/><rect x="62" y="18" width="15" height="185" rx="7" fill="${osc}" opacity=".5"/>`;
    for (const x of [51, 60]) s += `<line x1="${x}" y1="30" x2="${x}" y2="198" stroke="${cla}" stroke-width="2" opacity=".7"/>`;
    if (r() < .6) s += `<circle cx="60" cy="18" r="7" fill="#ff80ab"/><circle cx="60" cy="18" r="3" fill="#ffeb3b"/>`;
    return [120, 200, s];
  },
  roca(r, o) {
    const c = o.color || '#9e9e9e';
    const p = [[5, 70], [12, 42 + r() * 10], [32, 18 + r() * 10], [62, 8 + r() * 8], [92, 20 + r() * 10], [112, 48 + r() * 10], [118, 70]].map(q => q.map(v => +f1(v)));
    const pts = a => a.map(q => q.join(',')).join(' ');
    return [120, 70, `<polygon points="${pts(p)}" fill="${c}"/><polygon points="${pts([p[1], p[2], p[3], [60, 40], [25, 55]])}" fill="${tono(c, .22)}"/><polygon points="${pts([p[3], p[4], p[5], [118, 70], [70, 70], [60, 40]])}" fill="${tono(c, -.2)}"/>`];
  },
  arbusto(r, o) {
    const c = o.color || '#3e8e41'; let s = '';
    for (let i = 0; i < 6; i++) { const rr = 15 + r() * 10; s += `<circle cx="${f1(25 + r() * 70)}" cy="${f1(70 - rr - r() * 8)}" r="${f1(rr)}" fill="${i < 3 ? tono(c, -.18) : c}"/>`; }
    for (let i = 0; i < 3; i++) s += `<circle cx="${f1(30 + r() * 60)}" cy="${f1(30 + r() * 10)}" r="${f1(8 + r() * 5)}" fill="${tono(c, .2)}"/>`;
    if (o.bayas) for (let i = 0; i < 7; i++) s += `<circle cx="${f1(22 + r() * 76)}" cy="${f1(30 + r() * 28)}" r="3.5" fill="${o.bayas}"/>`;
    return [120, 70, `<g class="bal" style="--a:2deg;--d:${f1(3 + r() * 2)}s">${s}</g>`];
  },
  hierba(r, o) {
    const c = o.color || '#3d8b37', h = o.alto || 60; let s = '';
    for (let i = 0; i < 9; i++) { const dx = (r() - .5) * 44, hh = h * (.5 + r() * .5), x0 = 30 + (r() - .5) * 12; s += `<path d="M${f1(x0)} ${h} Q${f1(x0 + dx * .3)} ${f1(h - hh * .6)} ${f1(x0 + dx)} ${f1(h - hh)}" stroke="${tono(c, (r() - .5) * .35)}" stroke-width="3" fill="none" stroke-linecap="round"/>`; }
    return [60, h, `<g class="bal" style="--a:${f1(4 + r() * 4)}deg;--d:${f1(1.5 + r() * 1.5)}s">${s}</g>`];
  },
  flor(r, o) {
    const c = o.color || ['#e91e63', '#ff9800', '#ab47bc', '#fdd835', '#ffffff'][Math.floor(r() * 5)];
    let s = `<path d="M15 60 Q13 40 15 22" stroke="#388e3c" stroke-width="2.5" fill="none"/><ellipse cx="10" cy="45" rx="5" ry="2.5" fill="#43a047" transform="rotate(-30 10 45)"/>`;
    for (let i = 0; i < 5; i++) { const a = i * 72 * Math.PI / 180; s += `<circle cx="${f1(15 + Math.cos(a) * 6)}" cy="${f1(18 + Math.sin(a) * 6)}" r="5" fill="${c}"/>`; }
    return [30, 60, `<g class="bal" style="--a:6deg;--d:${f1(1.5 + r())}s">${s}<circle cx="15" cy="18" r="3.5" fill="#ffd54f"/></g>`];
  },
  helecho(r, o) {
    const c = o.color || '#2e7d32'; let s = '';
    for (let i = 0; i < 7; i++) {
      const a = (-160 + i * 23 + (r() - .5) * 8) * Math.PI / 180, l = 55 + r() * 25;
      const ex = 60 + Math.cos(a) * l, ey = 80 + Math.sin(a) * l * .8, cx = 60 + Math.cos(a) * l * .5, cy = 80 + Math.sin(a) * l * .8 - 15;
      const d = `M60 80 Q${f1(cx)} ${f1(cy)} ${f1(ex)} ${f1(ey)}`;
      s += `<path d="${d}" stroke="${tono(c, (r() - .5) * .3)}" stroke-width="12" fill="none" stroke-dasharray="4 2" stroke-linecap="round"/><path d="${d}" stroke="${tono(c, -.3)}" stroke-width="1.5" fill="none"/>`;
    }
    return [120, 80, `<g class="bal" style="--a:3deg;--d:${f1(2.5 + r() * 2)}s">${s}</g>`];
  },
  seta(r, o) {
    const c = o.color || '#e53935';
    return [50, 50, `<path d="M20 50 Q18 35 21 28 H29 Q32 35 30 50Z" fill="#f5ecd7"/><path d="M5 30 Q25 0 45 30 Z" fill="${c}"/><path d="M5 30 Q25 24 45 30Z" fill="${tono(c, -.3)}"/><circle cx="18" cy="18" r="3" fill="#fff"/><circle cx="30" cy="14" r="2.5" fill="#fff"/><circle cx="35" cy="24" r="2.5" fill="#fff"/><circle cx="13" cy="25" r="2" fill="#fff"/>`];
  },
  tronco() {
    return [140, 50, `<rect x="5" y="12" width="120" height="36" rx="18" fill="#7b5236"/><path d="M20 22 H100 M30 36 H110" stroke="#5d3c25" stroke-width="2"/><ellipse cx="122" cy="30" rx="14" ry="18" fill="#c49a6c"/><ellipse cx="122" cy="30" rx="8" ry="11" fill="none" stroke="#9c7046" stroke-width="2"/><ellipse cx="122" cy="30" rx="3" ry="4" fill="#9c7046"/><path d="M60 12 q4 -10 12 -8" stroke="#4caf50" stroke-width="3" fill="none"/>`];
  },
  coral(r, o) {
    const c = o.color || '#ff7096'; let s = '';
    const rama = (x, y, ang, len, w, n) => {
      const ex = x + Math.cos(ang) * len, ey = y + Math.sin(ang) * len;
      s += `<path d="M${f1(x)} ${f1(y)} L${f1(ex)} ${f1(ey)}" stroke="${n % 2 ? c : tono(c, -.12)}" stroke-width="${f1(w)}" stroke-linecap="round"/>`;
      if (n > 0) { rama(ex, ey, ang - .35 - r() * .35, len * .75, w * .72, n - 1); rama(ex, ey, ang + .35 + r() * .35, len * .75, w * .72, n - 1); }
      else s += `<circle cx="${f1(ex)}" cy="${f1(ey)}" r="${f1(w * .75)}" fill="${tono(c, .3)}"/>`;
    };
    rama(60, 120, -Math.PI / 2, 32, 12, 3);
    return [120, 120, `<g class="bal" style="--a:1.5deg;--d:${f1(3 + r() * 2)}s">${s}</g>`];
  },
  alga(r, o) {
    const c = o.color || '#2e9d5b'; let s = '';
    for (let i = 0; i < 3; i++) {
      const x = 18 + i * 11 + r() * 8, h = 120 + r() * 70; let d = `M${f1(x)} 200`;
      for (let k = 1; k <= 6; k++) d += ` Q${f1(x + (k % 2 ? 14 : -14))} ${f1(200 - h * (k - .5) / 6)} ${f1(x)} ${f1(200 - h * k / 6)}`;
      s += `<g class="bal" style="--a:${f1(6 + r() * 5)}deg;--d:${f1(2.5 + r() * 2)}s"><path d="${d}" stroke="${tono(c, (r() - .5) * .35)}" stroke-width="8" fill="none" stroke-linecap="round"/></g>`;
    }
    return [60, 200, s];
  },
  hielo(r) {
    const top = 20 + r() * 30;
    return [160, 90, `<polygon points="5,90 20,${f1(top + 20)} 60,${f1(top)} 110,${f1(top + 8)} 150,${f1(top + 30)} 158,90" fill="#e3f2fd"/><polygon points="60,${f1(top)} 110,${f1(top + 8)} 90,90 50,90" fill="#cfe5fb"/><polygon points="110,${f1(top + 8)} 150,${f1(top + 30)} 158,90 90,90" fill="#a9d0f5"/><polygon points="20,${f1(top + 20)} 60,${f1(top)} 45,${f1(top + 25)}" fill="#fff"/>`];
  },
  granero() {
    return [220, 180, `<rect x="25" y="70" width="170" height="110" fill="#c62828"/><rect x="150" y="70" width="45" height="110" fill="#8e1c1c" opacity=".5"/><polygon points="8,76 110,8 212,76" fill="#4e342e"/><polygon points="25,76 110,22 195,76" fill="#b71c1c"/><rect x="85" y="110" width="50" height="70" fill="#fff"/><rect x="90" y="115" width="40" height="65" fill="#8d2a1e"/><path d="M90 115 L130 180 M130 115 L90 180" stroke="#fff" stroke-width="4"/><rect x="98" y="45" width="24" height="22" fill="#fff"/><rect x="102" y="49" width="16" height="14" fill="#4e342e"/><rect x="25" y="76" width="170" height="5" fill="#fff"/>`];
  },
  valla() {
    let s = `<rect x="0" y="18" width="240" height="7" fill="#f5f5f5"/><rect x="0" y="36" width="240" height="7" fill="#f5f5f5"/>`;

// =====================================================================
//  CAPAS DEL FONDO (montañas, colinas, dunas...)
// =====================================================================
function cresta(c, w, h, r) {
  const y0 = c.y * h, A = (c.amp || .03) * h, f = [r() * 6, r() * 6, r() * 6], k = [.8 + r() * 1.5, 2.5 + r() * 3, 6 + r() * 5];
  const pts = [];
  for (let i = 0; i <= 100; i++) { const u = i / 100; pts.push([u * w, y0 - A * (Math.sin(u * k[0] * Math.PI + f[0]) * .55 + Math.sin(u * k[1] * Math.PI + f[1]) * .3 + Math.sin(u * k[2] * Math.PI + f[2]) * .15)]); }
  const lin = pts.map(p => f1(p[0]) + ' ' + f1(p[1])).join(' L');
  return [`M0 ${h} L${lin} L${w} ${h}Z`, 'M' + lin, pts];
}
const CAPAS = {
  colinas(c, w, h, r) { const [area] = cresta(c, w, h, r); return `<path d="${area}" fill="${c.color}"/>`; },
  dunas(c, w, h, r) {
    const [area, linea] = cresta(c, w, h, r), id = uid();
    return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${tono(c.color, .12)}"/><stop offset=".25" stop-color="${c.color}"/><stop offset="1" stop-color="${tono(c.color, -.15)}"/></linearGradient></defs><path d="${area}" fill="url(#${id})"/><path d="${linea}" stroke="${tono(c.color, .35)}" stroke-width="3" fill="none" opacity=".8"/>`;
  },
  montes(c, w, h, r) {
    const base = c.y * h, n = c.n || 5;
    let s = `<rect x="0" y="${f1(base - 1)}" width="${w}" height="${f1(h - base + 1)}" fill="${c.color}"/>`;
    const picos = [];
    for (let i = 0; i < n; i++) picos.push({ x: (i + .15 + r() * .7) / n * w, alto: c.alto * h * (.55 + r() * .45) });
    picos.sort((a, b) => b.alto - a.alto);
    for (const p of picos) {
      const px = p.x, py = base - p.alto, bw = p.alto * (c.ancho || 1.3);
      s += `<polygon points="${f1(px)},${f1(py)} ${f1(px + bw)},${f1(base)} ${f1(px - bw)},${f1(base)}" fill="${c.color}"/>`;
      s += `<polygon points="${f1(px)},${f1(py)} ${f1(px + bw)},${f1(base)} ${f1(px + bw * .12)},${f1(base)}" fill="#000" opacity=".1"/>`;
      if (c.nieve) {
        const t = .3, yy = py + p.alto * t;
        s += `<path d="M${f1(px)} ${f1(py)} L${f1(px - bw * t)} ${f1(yy)} L${f1(px - bw * t * .5)} ${f1(yy - p.alto * .05)} L${f1(px)} ${f1(yy + p.alto * .03)} L${f1(px + bw * t * .5)} ${f1(yy - p.alto * .06)} L${f1(px + bw * t)} ${f1(yy)} Z" fill="#fff" opacity=".95"/>`;
      }
    }
    return `<g opacity="${c.op || 1}">${s}</g>`;
  },
  pinos(c, w, h, r) {
    const base = c.y * h;
    let s = `<rect x="0" y="${f1(base - 2)}" width="${w}" height="${f1(h - base + 2)}" fill="${c.color}"/>`;
    for (let x = -10; x < w + 20; x += 8 + r() * 14) {
      const hh = c.h * h * (.6 + r() * .6), ww = hh * .28;
      s += `<polygon points="${f1(x)},${f1(base - hh)} ${f1(x - ww)},${f1(base + 2)} ${f1(x + ww)},${f1(base + 2)}" fill="${c.color}"/>`;
    }
    return s;
  },
  copas(c, w, h, r) {
    const base = c.y * h, R = c.r * (h / 800);
    let s = `<rect x="0" y="${f1(base)}" width="${w}" height="${f1(h - base)}" fill="${c.color}"/>`;
    for (let x = -R; x < w + R; x += R * (.8 + r() * .6)) {
      const rr = R * (.7 + r() * .6), cy = base - r() * R * .5;
      s += `<circle cx="${f1(x)}" cy="${f1(cy)}" r="${f1(rr)}" fill="${c.color}"/>`;
      if (r() < .5) s += `<circle cx="${f1(x - rr * .25)}" cy="${f1(cy - rr * .35)}" r="${f1(rr * .45)}" fill="${tono(c.color, .1)}"/>`;
    }
    return s;
  },
  mesetas(c, w, h, r) {
    const base = c.y * h, col = c.color, osc = tono(col, -.12);
    let s = `<rect x="0" y="${f1(base)}" width="${w}" height="${f1(h - base)}" fill="${col}"/>`;
    for (let i = 0; i < 4; i++) {
      const x = r() * w, ww = w * (.08 + r() * .12), hh = h * (.05 + r() * .09);
      s += `<polygon points="${f1(x)},${f1(base + 1)} ${f1(x + ww * .12)},${f1(base - hh)} ${f1(x + ww * .88)},${f1(base - hh)} ${f1(x + ww)},${f1(base + 1)}" fill="${col}"/>`;
      s += `<rect x="${f1(x + ww * .1)}" y="${f1(base - hh * .62)}" width="${f1(ww * .82)}" height="${f1(hh * .06)}" fill="${osc}"/><rect x="${f1(x + ww * .06)}" y="${f1(base - hh * .3)}" width="${f1(ww * .9)}" height="${f1(hh * .06)}" fill="${osc}"/>`;
      s += `<polygon points="${f1(x + ww * .6)},${f1(base - hh)} ${f1(x + ww * .88)},${f1(base - hh)} ${f1(x + ww)},${f1(base + 1)} ${f1(x + ww * .7)},${f1(base + 1)}" fill="#000" opacity=".1"/>`;
    }
    return s;
  },
  campos(c, w, h, r) {
    const [area, , pts] = cresta(c, w, h, r), id = uid();
    const cols = ['#9ccc65', '#c5e1a5', '#d4e157', '#8bc34a', '#e6ee9c', '#aed581'];
    let s = `<defs><clipPath id="${id}"><path d="${area}"/></clipPath></defs><path d="${area}" fill="#9ccc65"/><g clip-path="url(#${id})">`;
    let x = -w * .3; const top = c.y * h - h * .1;
    while (x < w * 1.3) { const bw = w * (.05 + r() * .08); s += `<polygon points="${f1(x)},${f1(top)} ${f1(x + bw)},${f1(top)} ${f1((x + bw - w / 2) * 2.4 + w / 2)},${h} ${f1((x - w / 2) * 2.4 + w / 2)},${h}" fill="${cols[Math.floor(r() * cols.length)]}"/>`; x += bw; }
    s += '</g>';
    for (let i = 0; i < 14; i++) { const p = pts[Math.floor(r() * pts.length)]; s += `<circle cx="${f1(p[0])}" cy="${f1(p[1] - 3)}" r="${f1(5 + r() * 5)}" fill="#558b2f"/>`; }
    return s;
  },
  niebla(c, w, h) {
    const y = c.y * h, id = uid();
    return `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c.color}" stop-opacity="0"/><stop offset=".5" stop-color="${c.color}" stop-opacity=".8"/><stop offset="1" stop-color="${c.color}" stop-opacity="0"/></linearGradient></defs><rect x="0" y="${f1(y - h * .08)}" width="${w}" height="${f1(h * .16)}" fill="url(#${id})"/>`;
  }
};

// Texturas del suelo
const TEXTURAS = {
  hierba(w, h, hz, r) {
    const col = escena.colorHierba || '#2f7a2c';
    let s = `<g stroke="${col}" stroke-linecap="round" fill="none">`;
    for (let i = 0; i < 320; i++) {
      const d = Math.pow(r(), .8), y = hz + d * (h - hz), x = r() * w, l = 2 + d * 14;
      s += `<path d="M${f1(x)} ${f1(y)} l${f1(-l * .35)} ${f1(-l)} M${f1(x)} ${f1(y)} l0 ${f1(-l * 1.2)} M${f1(x)} ${f1(y)} l${f1(l * .35)} ${f1(-l)}" stroke-width="${f1(.6 + d * 2)}" opacity="${(.35 + r() * .5).toFixed(2)}"/>`;
    }
    s += '</g>';
    if (escena.flores) for (let i = 0; i < 70; i++) { const d = r(); s += `<circle cx="${f1(r() * w)}" cy="${f1(hz + d * (h - hz))}" r="${f1(1 + d * 3)}" fill="${['#fff', '#ffeb3b', '#f48fb1'][i % 3]}"/>`; }
    return s;
  },
  arena(w, h, hz, r) {
    let s = `<g fill="none" stroke-linecap="round">`;
    for (let i = 0; i < 90; i++) { const d = r(), y = hz + d * (h - hz), x = r() * w, l = 20 + d * 120; s += `<path d="M${f1(x)} ${f1(y)} q${f1(l / 2)} ${f1(-3 - d * 6)} ${f1(l)} 0" stroke="${r() < .5 ? '#fff6dc' : '#c9944a'}" stroke-width="${f1(1 + d * 2)}" opacity=".45"/>`; }
    return s + '</g>';
  },
  nieve(w, h, hz, r) {
    let s = '';
    for (let i = 0; i < 50; i++) { const d = r(), rx = 20 + d * 130; s += `<ellipse cx="${f1(r() * w)}" cy="${f1(hz + d * (h - hz))}" rx="${f1(rx)}" ry="${f1(rx * .12)}" fill="#c3d6ee" opacity=".5"/>`; }
    for (let i = 0; i < 90; i++) { const d = r(); s += `<circle cx="${f1(r() * w)}" cy="${f1(hz + d * (h - hz))}" r="${f1(.8 + d * 1.8)}" fill="#fff"/>`; }
    return s;
  },
  fondoMar(w, h, hz, r) {
    let s = TEXTURAS.arena(w, h, hz, r);
    for (let i = 0; i < 40; i++) { const d = r(); s += `<ellipse cx="${f1(r() * w)}" cy="${f1(hz + d * (h - hz))}" rx="${f1(2 + d * 6)}" ry="${f1(1.5 + d * 4)}" fill="${['#9e9e9e', '#bcaaa4', '#8d6e63'][i % 3]}"/>`; }
    return s;
  }
};

        let fuera = true;
        for (const p of bandada.aves) {
          p.x += bandada.dir * bandada.v * dt; if (p.x > -60 && p.x < w + 60) fuera = false;
          const ala = Math.sin(t * 9 + p.f) * 4;
          ctxF.beginPath(); ctxF.moveTo(p.x - 7, p.y - ala); ctxF.quadraticCurveTo(p.x - 3, p.y - 2, p.x, p.y); ctxF.quadraticCurveTo(p.x + 3, p.y - 2, p.x + 7, p.y - ala); ctxF.stroke();
        }
        if (fuera) { bandada = null; proxBandada = azar(6, 14); }
      }
    }
    if (ef === 'niebla' || ef === 'calor') {
      ctxD.globalAlpha = ef === 'calor' ? .12 : .2;
      for (const n of a) { n.x += n.v * dt; if (n.x > w + 100) n.x = -600 * n.s; ctxD.drawImage(spriteNiebla, n.x + cam * .3, n.y - 60 * n.s, 600 * n.s, 140 * n.s); }
      ctxD.globalAlpha = 1;
    }
    if (ef === 'rayos') {
      const g = ctxD.createLinearGradient(0, 0, 0, h * .9);
      const c = escena.marino ? '220,250,255' : '255,245,200';
      g.addColorStop(0, `rgba(${c},.5)`); g.addColorStop(1, `rgba(${c},0)`);
      ctxD.fillStyle = g;
      const inc = escena.marino ? -.25 : .45;
      for (const r of a) {
        ctxD.globalAlpha = .12 + .1 * Math.sin(t * .5 + r.f);
        ctxD.beginPath(); ctxD.moveTo(r.x, 0); ctxD.lineTo(r.x + r.w, 0); ctxD.lineTo(r.x + r.w * 2.5 + inc * h, h * .9); ctxD.lineTo(r.x + inc * h, h * .9); ctxD.fill();
      }
      ctxD.globalAlpha = 1;
    }
    if (ef === 'nieve') {
      ctxD.fillStyle = 'rgba(255,255,255,.9)'; ctxD.beginPath();
      for (const s of a) {
        s.y += s.v * dt; s.x += Math.sin(t + s.f) * 18 * dt;
        if (s.y > h + 5) { s.y = -5; s.x = azar(0, w); }
        ctxD.moveTo(s.x + s.r, s.y); ctxD.arc(s.x, s.y, s.r, 0, 7);
      }
      ctxD.fill();
    }
    if (ef === 'burbujas') {
      ctxD.lineWidth = 1.5;
      for (const b of a) {
        b.y -= b.v * dt; b.x += Math.sin(t * 2 + b.f) * .5;
        if (b.y < -10) { b.y = h + 10; b.x = azar(0, w); }
        ctxD.strokeStyle = 'rgba(255,255,255,.55)'; ctxD.beginPath(); ctxD.arc(b.x, b.y, b.r, 0, 7); ctxD.stroke();
        ctxD.fillStyle = 'rgba(255,255,255,.7)'; ctxD.beginPath(); ctxD.arc(b.x - b.r * .35, b.y - b.r * .35, b.r * .25, 0, 7); ctxD.fill();
      }
    }
    if (ef === 'motas' || ef === 'plancton' || ef === 'luciernagas') {
      const col = ef === 'luciernagas' ? '255,236,120' : ef === 'plancton' ? '230,250,255' : '255,250,210';
      for (const m of a) {
        m.vx += (Math.random() - .5) * 40 * dt; m.vy += (Math.random() - .5) * 40 * dt;
        m.vx = limitar(m.vx, -20, 20); m.vy = limitar(m.vy, -15, 15);
        m.x += m.vx * dt; m.y += m.vy * dt;
        if (m.x < -10) m.x = w + 10; if (m.x > w + 10) m.x = -10; if (m.y < 0 || m.y > h) m.vy *= -1;
        const al = ef === 'luciernagas' ? .35 + .65 * Math.max(0, Math.sin(t * 2 + m.f)) : .5 + .3 * Math.sin(t * 2 + m.f);
        ctxD.fillStyle = `rgba(${col},${(al * .25).toFixed(3)})`; ctxD.beginPath(); ctxD.arc(m.x, m.y, m.r * 3.5, 0, 7); ctxD.fill();
        ctxD.fillStyle = `rgba(${col},${al.toFixed(3)})`; ctxD.beginPath(); ctxD.arc(m.x, m.y, m.r, 0, 7); ctxD.fill();
      }
    }
    if (ef === 'hojas') {
      for (let i = 0; i < a.length; i++) {
        const l = a[i];
        l.y += l.v * dt; l.x += Math.sin(t * 1.5 + l.f) * 35 * dt; l.rot += l.vr * dt;
        if (l.y > h + 20) a[i] = nuevaHoja(false);
        ctxD.save(); ctxD.translate(l.x, l.y); ctxD.rotate(l.rot); ctxD.scale(1, Math.abs(Math.sin(t * 2 + l.f)) * .7 + .3);
        ctxD.fillStyle = l.c; ctxD.beginPath(); ctxD.ellipse(0, 0, l.s, l.s * .5, 0, 0, 7); ctxD.fill(); ctxD.restore();
      }
    }
    if (ef === 'arena') {
      ctxD.strokeStyle = 'rgba(255,240,210,.35)'; ctxD.lineWidth = 1.2; ctxD.beginPath();
      for (const s of a) { s.x += s.v * dt; if (s.x > w + 150) { s.x = -150; s.y = azar(hz, h); } ctxD.moveTo(s.x, s.y); ctxD.lineTo(s.x + s.l, s.y - 2); }
      ctxD.stroke();
    }
  }
  // polvo que levantan los animales al huir
  const cp = escena.marino ? '255,255,255' : claveEscena === 'polo' ? '255,255,255' : '200,170,120';
  for (let i = polvo.length - 1; i >= 0; i--) {
    const p = polvo[i]; p.vida -= dt * 1.6; p.r += dt * 30; p.y -= dt * 10;
    if (p.vida <= 0) { polvo.splice(i, 1); continue; }
    ctxD.fillStyle = `rgba(${cp},${(p.vida * .45).toFixed(3)})`; ctxD.beginPath(); ctxD.arc(p.x, p.y, p.r, 0, 7); ctxD.fill();
  }
}

// =====================================================================
//  ANIMALES
// =====================================================================
const ACCIONES = { suelo: ['mira', 'come', 'respira', 'salta', 'sienta', 'mira'], agua: ['respira', 'mira'], aire: ['respira'] };

function tamAnimal(a) {
  const b = tamBase();
  a.el.style.fontSize = b + 'px';
  a.sombra.style.width = b * .9 + 'px'; a.sombra.style.height = b * .2 + 'px';
}

function crearAnimal(dentro, T, extra = {}) {
  T = T || elegir(escena.animales);
  const el = document.createElement('div');
  el.className = 'animal';
  el.innerHTML = `<span class="burbuja"></span><span class="cuerpo">${T.e}</span><span class="nombre">${T.n}</span>`;
  const sombra = document.createElement('div'); sombra.className = 'sombra';
  if (T.t !== 'suelo') sombra.style.display = 'none';
  const dir = extra.dir || (Math.random() < .5 ? 1 : -1);
  const a = {
    el, sombra, T, dir, cara: dir, cuerpo: el.querySelector('.cuerpo'), burbuja: el.querySelector('.burbuja'),
    x: dentro ? azar(.15, .85) * W() : (dir === 1 ? -150 - (extra.off || 0) : W() + 150 + (extra.off || 0)),
    d: extra.d ?? azar(.05, .8), dObj: azar(.1, .9), alt: azar(.1, .9), altObj: azar(.1, .9),
    vel: extra.vel || T.v * azar(.85, 1.15), estado: 'pasea', tDec: azar(2, 5), fase: Math.random() * 10,
    sem: Math.random() * 100, umbral: azar(.42, .85), salto: 0, saltoAmp: 40, accion: null, tAcc: 0, filtro: -1, tPolvo: 0
  };
  a.vx = dentro ? 0 : a.dir * a.vel;
  a.dObj = a.d;
  el.addEventListener('pointerdown', ev => { ev.stopPropagation(); tocarAnimal(a); });
  tamAnimal(a);
  escenaEl.appendChild(sombra); escenaEl.appendChild(el);
  animales.push(a);
  return a;
}

function aparecer() {
  const T = elegir(escena.animales);
  const a = crearAnimal(false, T);
  if (T.manada && Math.random() < .65) {
    const n = 1 + Math.floor(Math.random() * 2);
    for (let i = 1; i <= n; i++) crearAnimal(false, T, { dir: a.dir, off: i * azar(90, 170), d: limitar(a.d + azar(-.18, .18), 0, 1), vel: a.vel * azar(.95, 1.05) });
  }
}

function quitar(a) { a.el.remove(); a.sombra.remove(); animales.splice(animales.indexOf(a), 1); }

function bocadillo(a, txt, seg = 1.8) {
  a.burbuja.textContent = txt;
  a.burbuja.classList.remove('pop'); void a.burbuja.offsetWidth; a.burbuja.classList.add('pop');
  clearTimeout(a.tBoc);
  a.tBoc = setTimeout(() => { if (!a.fijo) a.burbuja.classList.remove('pop'); }, seg * 1000);
}

function tocarAnimal(a) {
  if (a.estado === 'huye' || a.estado === 'sobresalto') return;
  a.el.classList.add('nombrado');
  a.salto = 1; a.saltoAmp = 45;
  bocadillo(a, elegir(['❤️', '😊', '✨']));
  hablar(a.T.n);
  clearTimeout(a.tNombre);
  a.tNombre = setTimeout(() => a.el.classList.remove('nombrado'), 2500);
}

const huyendo = a => a.estado === 'huye' || a.estado === 'sobresalto';
function asustar(a) {
  if (huyendo(a)) return;
  a.estado = 'sobresalto'; a.tEst = azar(.2, .45); a.fijo = true;
  a.dir = a.x < W() / 2 ? -1 : 1;
  a.salto = 1; a.saltoAmp = 60;
  a.dObj = 0;
  if (a.T.t === 'aire') a.altObj = -1;
  if (a.T.t === 'agua') a.altObj = Math.random() < .5 ? 0 : 1;
  bocadillo(a, elegir(['😱', '❗', '💦']), 5);
  a.el.classList.remove('nombrado');
}

function decidir(a, confiados) {
  const T = a.T, tipo = T.t;
  a.tDec = azar(2.5, 6);
  if (a.estado === 'pausa' || a.estado === 'curioso') { a.estado = 'pasea'; a.accion = null; a.dObj = confiados ? azar(.5, 1) : azar(0, .9); return; }
  const r = Math.random();
  if (tipo === 'aire') {
    a.altObj = azar(0, 1); a.dObj = confiados ? azar(.4, 1) : azar(0, .9); a.planea = Math.random() < .4;
    if (r < .2 && a.x > W() * .2 && a.x < W() * .8) a.dir *= -1;
    return;
  }
  if (confiados && r < .3) {        // se acerca a mirar
    a.estado = 'curioso'; a.dObj = azar(.85, 1); a.accion = 'respira'; a.tAcc = 0; a.tDec = azar(3, 5);
    bocadillo(a, elegir(['❤️', '😊', '✨', '👀'])); return;
  }
  if (r < .45) {                     // se para a hacer algo
    a.estado = 'pausa'; a.accion = elegir(T.acc || ACCIONES[tipo]); a.tAcc = 0; a.saltoHecho = false; a.tDec = azar(1.8, 4);
    if (a.accion === 'duerme') { a.tDec = azar(3, 5); bocadillo(a, '💤', a.tDec); }
    else if (Math.random() < .35) bocadillo(a, elegir(T.emo || ['🎵', '❤️', '✨']));
    return;
  }
  if (r < .58 && a.x > W() * .2 && a.x < W() * .8) a.dir *= -1;   // se da la vuelta
  a.dObj = confiados ? azar(.5, 1) : azar(0, .9);                   // se acerca o se aleja
  if (tipo === 'agua') a.altObj = azar(0, 1);
}

function moverAnimal(a, dt, t, nervioso, confiados) {
  const T = a.T, tipo = T.t, g = T.g || (tipo === 'aire' ? 'vuela' : tipo === 'agua' ? 'nada' : 'anda');

  // --- estado ---
  if (a.estado === 'sobresalto') { a.tEst -= dt; if (a.tEst <= 0) a.estado = 'huye'; }
  else if (a.estado !== 'huye') {
    if (nervioso !== !!a.nerv) {
      a.nerv = nervioso;
      if (nervioso) { a.fijo = true; bocadillo(a, '❓', 99); a.dObj = Math.min(a.dObj, .2); if (a.estado !== 'pasea') { a.estado = 'pasea'; a.accion = null; } }
      else { a.fijo = false; a.burbuja.classList.remove('pop'); }
    }
    a.tDec -= dt;
    if (a.tDec <= 0 && !nervioso) decidir(a, confiados);
    if (a.estado === 'pausa' || a.estado === 'curioso') a.tAcc += dt;
  }

  // --- velocidad con aceleración suave ---
  let vObj = 0;
  if (a.estado === 'pasea') vObj = a.vel * (nervioso ? .3 : 1);
  else if (a.estado === 'huye') vObj = a.vel * 2.5 + 280;
  if (tipo === 'aire' && a.estado !== 'huye' && a.estado !== 'sobresalto') vObj = Math.max(vObj, a.vel * .6);
  a.vx += (a.dir * vObj - a.vx) * Math.min(1, dt * (a.estado === 'huye' ? 4 : 1.6));
  a.x += a.vx * dt;

  const vd = a.estado === 'huye' ? .8 : .18;
  a.d += limitar(a.dObj - a.d, -vd * dt, vd * dt);
  const va = a.estado === 'huye' ? 1.3 : .15;
  a.alt += limitar(a.altObj - a.alt, -va * dt, va * dt);

  let caraObj = a.dir;
  if (a.estado === 'pausa' && a.accion === 'mira' && (a.tAcc % 1.8) > .9) caraObj = -a.dir;
  a.cara += limitar(caraObj - a.cara, -dt * 7, dt * 7);
  const lado = a.cara >= 0 ? 1 : -1;

  if (a.x < -300 || a.x > W() + 300 || (tipo === 'aire' && a.alt < -.8)) { quitar(a); return; }

  // --- animación del cuerpo ---
  const sp = Math.min(1.6, Math.abs(a.vx) / Math.max(25, a.vel));
  const m = Math.min(1, sp);
  const esc = escalaDe(a.d) * (T.s || 1);
  let bob = 0, rot = 0, sx = 1, sy = 1, skew = 0, y;
  const [y0, y1] = zona(tipo);

  if (tipo === 'suelo') {
    y = sueloY(a.d);
    if (sp > .03) a.fase += dt * (g === 'brinca' ? 1.5 + sp * 5 : g === 'lento' ? 1 + sp * 2 : 2 + sp * 9) * (g === 'trota' ? 1.25 : 1);
    if (g === 'anda') { bob = -Math.abs(Math.sin(a.fase)) * 7 * m; rot = Math.sin(a.fase * 2) * 3 * m; }
    else if (g === 'trota') { bob = -Math.abs(Math.sin(a.fase)) * 14 * m; rot = -Math.cos(a.fase * 2) * 4 * m * lado; }
    else if (g === 'brinca') {
      const s = Math.sin(a.fase);
      if (s > 0) { bob = -s * 34 * m; rot = -Math.cos(a.fase) * 12 * m * lado; sy = 1 + .06 * s * m; sx = 1 - .04 * s * m; }
      else { sy = 1 + .1 * s * m; sx = 1 - .08 * s * m; }
    }
    else if (g === 'repta') { sx = 1 + .07 * Math.sin(a.fase * 2) * m; sy = 1 - .05 * Math.sin(a.fase * 2) * m; rot = Math.sin(a.fase) * 2 * m; }
    else if (g === 'contonea') { rot = Math.sin(a.fase) * 12 * m; bob = -Math.abs(Math.sin(a.fase)) * 4 * m; }
    else if (g === 'lento') { rot = Math.sin(a.fase) * 4 * m; bob = -Math.abs(Math.sin(a.fase)) * 2 * m; }

    if (a.estado === 'pausa' || a.estado === 'curioso') {
      const ta = a.tAcc;
      if (a.accion === 'come') { rot = (16 + Math.sin(ta * 7) * 4) * lado * Math.min(1, ta * 3); bob = 2; }
      else if (a.accion === 'sienta' || a.accion === 'duerme') { const k = Math.min(1, ta * 4); sy = 1 - .1 * k + (a.accion === 'duerme' ? Math.sin(ta * 2) * .02 : 0); sx = 1 + .06 * k; }
      else if (a.accion === 'salta' && !a.saltoHecho) { a.salto = 1; a.saltoAmp = 40; a.saltoHecho = true; }
      else if (a.accion === 'rasca') rot = Math.sin(ta * 14) * 4;
      sy *= 1 + .02 * Math.sin(t * 3 + a.sem);
    }
    if (a.estado === 'huye' || a.estado === 'sobresalto') {
      a.tPolvo -= dt;
      if (a.tPolvo < 0 && a.estado === 'huye') { a.tPolvo = .05; polvo.push({ x: a.x + cam * (.4 + .6 * a.d) - a.dir * 25 * esc, y: y - 4, r: 4 + 6 * esc, vida: 1 }); }
    }
  } else if (tipo === 'aire') {
    y = (y0 + a.alt * (y1 - y0)) * H() + Math.sin(t * 1.7 + a.sem) * 12;
    const subir = a.alt - a.altObj;
    rot = -limitar(subir * 40, -18, 18) * lado;
    if (g === 'revolotea') { y += Math.sin(t * 6 + a.sem) * 10 + Math.sin(t * 2.3 + a.sem) * 18; sy = 1 - .5 * Math.abs(Math.sin(t * 18 + a.sem)); rot += Math.sin(t * 3 + a.sem) * 8; }
    else {
      const huyendo = a.estado === 'huye' || a.estado === 'sobresalto';
      if (!a.planea || huyendo || Math.abs(subir) > .1) a.fase += dt * (huyendo ? 22 : 12);
      sy = 1 - .25 * Math.abs(Math.sin(a.fase));
    }
  } else {   // agua
    y = (y0 + a.alt * (y1 - y0)) * H() + Math.sin(t * 1.1 + a.sem) * 10 * (g === 'pulsa' ? 2 : 1);
    const subir = a.alt - a.altObj;
    if (g === 'pulsa') { const p = Math.sin(t * 3 + a.sem); sy = 1 + .14 * p; sx = 1 - .09 * p; y -= Math.max(0, p) * 8; }
    else { a.fase += dt * (3 + sp * 9); skew = Math.sin(a.fase) * 5 * (.4 + m); rot = -limitar(subir * 40, -15, 15) * lado + Math.cos(t * 1.1 + a.sem) * 3; }
  }

  if (a.salto > 0) { bob -= Math.sin(a.salto * Math.PI) * a.saltoAmp; a.salto = Math.max(0, a.salto - dt * 2.4); }

  // --- dibujar ---
  const px = a.x + cam * (.4 + .6 * a.d);
  a.el.style.transform = `translate(${f1(px)}px, ${f1(y + bob * esc)}px) translate(-50%, -100%) scale(${esc.toFixed(3)}) rotate(${f1(rot)}deg)`;
  a.cuerpo.style.transform = `scale(${(-a.cara * sx).toFixed(3)}, ${sy.toFixed(3)}) skewY(${f1(skew)}deg)`;
  a.el.style.zIndex = 10 + Math.round(a.d * 100);
  const fb = Math.round(a.d * 10);
  if (fb !== a.filtro) { a.filtro = fb; a.el.style.filter = bruma(fb / 10); }
  if (tipo === 'suelo') {
    const alto = Math.min(1, -bob / 70);
    a.sombra.style.transform = `translate(${f1(px)}px, ${f1(y)}px) translate(-50%, -50%) scale(${(esc * (1 - alto * .4)).toFixed(3)})`;
    a.sombra.style.opacity = (.8 * (1 - alto * .6)).toFixed(2);
    a.sombra.style.zIndex = 9 + Math.round(a.d * 100);
  }
}

// =====================================================================
//  BUCLE PRINCIPAL
// =====================================================================
let ultimo = performance.now(), ultimoMsg = '';
window.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') { camObj = (.5 - e.clientX / W()) * 50; ultimoRaton = performance.now(); } });

function bucle(ahora) {
  const dt = Math.min(.05, (ahora - ultimo) / 1000); ultimo = ahora;
  const t = ahora / 1000;
  if (!escena) { requestAnimationFrame(bucle); return; }

  leerMicro(ahora);
  ruido *= Math.pow(.25, dt);
  if (ruido > UMBRAL_NERVIO) calmaDesde = ahora;
  // Nunca huyen todos a la vez: sale uno, luego otro... (primero los más miedosos).
  // Con un grito se acaban yendo todos, pero también de uno en uno.
  if (ruido > UMBRAL_GRITO) evacuando = true;
  const quedan = animales.filter(a => !huyendo(a)).sort((p, q) => p.umbral - q.umbral);
  if (evacuando) { asustadosHasta = ahora + 2500; if (!quedan.length) evacuando = false; }
  if (ahora >= proximoSusto) {
    const a = evacuando ? quedan[0] : quedan.find(a => ruido > a.umbral);
    if (a) { asustar(a); proximoSusto = ahora + (evacuando ? azar(450, 750) : azar(800, 1300)); sustoParcialHasta = ahora + 2200; }
  }
  const nervioso = ruido > UMBRAL_NERVIO;
  const confiados = ahora - calmaDesde > 6000;

  let msg;
  if (evacuando) msg = '😱 ¡Un grito! Se están yendo todos...';
  else if (ahora < asustadosHasta) msg = '😱 ¡Se han escondido todos!';
  else if (ahora < sustoParcialHasta) msg = '🙉 ¡Uy! Algunos se han ido...';
  else if (nervioso) msg = '👀 Shhh... están nerviosos';
  else if (confiados) msg = '😊 ¡Qué silencio! Se acercan';
  else msg = '🤫 Silencio... ¡vienen los animales!';
  if (msg !== ultimoMsg) { $('mensaje').textContent = msg; $('mensaje').classList.toggle('alerta', ahora < asustadosHasta); ultimoMsg = msg; }
  $('nivel').style.width = Math.min(100, ruido * 100) + '%';
  $('nivel').style.background = ruido > UMBRAL_GRITO ? '#e53935' : ruido > .42 ? '#ff7043' : nervioso ? '#ffa726' : '#66bb6a';
  $('cara').textContent = ruido > UMBRAL_GRITO ? '😱' : ruido > .42 ? '😨' : nervioso ? '😮' : '🙂';

  // cámara: sigue al ratón, o se mece sola
  if (ahora - ultimoRaton > 4000) camObj = Math.sin(t / 9) * 18;
  cam += (camObj - cam) * Math.min(1, dt * 2.5);
  moverDecor();

  const activos = animales.filter(a => !huyendo(a)).length;
  if (ahora > asustadosHasta && ahora > sustoParcialHasta && !nervioso && activos < MAX_ANIMALES && Math.random() < dt * (confiados ? .9 : .45)) aparecer();

  for (const a of [...animales]) moverAnimal(a, dt, t, nervioso, confiados);
  dibujarAmbiente(dt, t);
  requestAnimationFrame(bucle);
}

// =====================================================================
//  RUIDO: micrófono, botón y barra espaciadora
// =====================================================================
let analizador = null, datos = null;
$('btnMic').onclick = async () => {
  if (analizador) return;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    analizador = ctx.createAnalyser(); analizador.fftSize = 1024;
    datos = new Float32Array(analizador.fftSize);
    ctx.createMediaStreamSource(stream).connect(analizador);
    $('btnMic').textContent = '🎤 Escuchando'; $('btnMic').classList.add('on');
  } catch (e) {
    alert('No se ha podido usar el micrófono. Podéis usar el botón "¡Ruido!" o la barra espaciadora.');
  }
};
function leerMicro(ahora) {
  if (!analizador || ahora < ignorarMicHasta) return;
  analizador.getFloatTimeDomainData(datos);
  let suma = 0;
  for (let i = 0; i < datos.length; i++) suma += datos[i] * datos[i];
  const nivel = Math.min(1.2, Math.sqrt(suma / datos.length) * +$('sens').value * 2.5);
  if (nivel > ruido) ruido = nivel;
}
function hacerRuido() { ruido = Math.min(1.2, ruido + .3); }
$('btnPalmada').onclick = hacerRuido;
window.addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); hacerRuido(); } });

// =====================================================================
//  VOZ
// =====================================================================
function hablar(texto) {
  if (!('speechSynthesis' in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(texto);
  u.lang = 'es-ES'; u.rate = .9; u.pitch = 1.2;
  ignorarMicHasta = performance.now() + 2000;
  speechSynthesis.speak(u);
}

cambiarEscena('selva', true);
requestAnimationFrame(bucle);
</script>
